<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#D4AF37">
    <meta name="description" content="敦煌金加工车间 ERP - 贵金属首饰 MES">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏭%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🏭%3C/text%3E%3C/svg%3E">
    <title>敦煌金加工车间 ERP - 离线预览</title>
    <link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
    <!-- 顶栏 -->
    <nav class="navbar">
        <button class="menu-toggle" title="折叠侧边栏">☰</button>
        <div class="brand">
            <div class="brand-icon">🏭</div>
            <span>敦煌金加工车间 ERP</span>
        </div>
        <div class="breadcrumb"></div>
        <div class="spacer"></div>
        <input type="text" class="search" placeholder="🔍 搜索 (按 / 聚焦, Ctrl+K 命令面板)">
        <div class="user-avatar" title="车间主任 - 菩提老祖">👤</div>
    </nav>

    <!-- 侧边栏 -->
    <aside class="sidebar"></aside>

    <!-- 主内容 -->
    <main class="main"></main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/beautify.js"></script>
    <script src="assets/js/renderers.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/shortcuts.js"></script>
    <script>
    // PWA: 注册 Service Worker
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.warn('SW failed:', err));
        });
    }
    </script>
</body>
</html>
