<div class="page-header">

        <button class="btn"><span>📊</span> 看板</button>

    </div>
</div>

<div class="kpi-grid">

        <div class="label">工位总数</div>
        <div class="value">4</div>
        <div class="sub">油压 1 / 失蜡 1 / 精加工 1 / 质检 1</div>

    <div class="kpi-card success">
        <div class="label">运行中</div>
        <div class="value">3</div>

        <div class="sub">总设备数</div>
    </div>
</div>

                <tr>

                <tr>
                    <td><code>WS-QC</code></td>
                    <td>质检工位</td>
