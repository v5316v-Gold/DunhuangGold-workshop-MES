<!-- 损耗监控预警 v2: 3 层监控 + 实时状态 -->
<div class="page-header">
    <h1>📉 损耗监控预警</h1>
    <div class="actions">
        <input type="text" id="loss-search" class="loss-search" placeholder="🔍 搜索预警 (操作员/工位/设备)">
        <select id="loss-filter-severity" class="loss-filter">
            <option value="">全部级别</option>
            <option value="danger">🔴 红色</option>
            <option value="warning">🟡 黄色</option>
            <option value="info">ℹ️ 提示</option>
        </select>
        <select id="loss-filter-status" class="loss-filter">
            <option value="">全部状态</option>
            <option value="open">⏳ 待处理</option>
            <option value="acknowledged">👀 已确认</option>
            <option value="resolved">✅ 已解决</option>
        </select>
        <button class="btn btn-ripple" onclick="window.RENDERERS.loss_monitor(document.querySelector('.main'))">🔄 刷新</button>
    </div>
</div>

<div id="loss-monitor-content">
    <div class="empty-state">
        <div class="spinner-gold"></div>
        <div class="loading-text">加载损耗数据...</div>
    </div>
</div>

<style>
/* 顶部工具条 (整合到 page-header .actions) */
.loss-search, .loss-filter {
    background: var(--bg-tertiary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    font-size: var(--text-base);
    min-height: 36px;
    margin-right: 8px;
}
.loss-search { min-width: 220px; }
.loss-filter { min-width: 130px; }
.loss-search:focus, .loss-filter:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px var(--gold-muted);
    outline: none;
}

}

</style>
