<!-- Phase 3.3: 包装 -->
<div class="page-header">
    <h1>📦 包装</h1>
    <div class="actions">
        <input type="text" id="pkg-qr" placeholder="扫描包装 QR (防伪核验)" style="width:280px">
        <button class="btn btn-ripple" onclick="verifyPkg()">🔍 核验</button>
        <button class="btn btn-primary btn-ripple" onclick="alert('包装创建表单建设中')">+ 新建包装</button>
    </div>
</div>

<div id="pkg-list"></div>

<style>
.pkg-card {
    display: flex;
    gap: 16px;
    padding: 16px;
    margin-bottom: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: var(--radius-lg);
    transition: all var(--transition-fast);
}
.pkg-card:hover { border-color: var(--gold-border); box-shadow: var(--shadow-gold); }
.pkg-card .pkg-no { font-size: 18px; font-weight: 600; color: var(--gold); }
.pkg-card .pkg-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.pkg-card .pkg-stats { display: flex; gap: 24px; margin-top: 12px; }
.pkg-card .pkg-stats .stat-label { font-size: 11px; color: var(--text-muted); }
.pkg-card .pkg-stats .stat-value { font-size: 18px; color: var(--gold-bright); font-weight: 600; }
.pkg-card .pkg-cert { margin-top: 8px; padding: 6px 10px; background: var(--gold-muted); border-radius: var(--radius-sm); font-size: 12px; color: var(--gold-bright); }
</style>

<script>
function verifyPkg() {
    const qr = document.getElementById('pkg-qr').value.trim();
    if (!qr) { window.toast('warning', '请输入或扫描包装 QR'); return; }
    window.apiGet('/package/verify', { qr }).then(r => {
        if (r.data && r.data.found) {
            window.toast('success', `✓ ${r.data.package_name} 正品 NGTC:${r.data.ngtc_cert_no}`);
        } else {
            window.toast('error', '✗ 未找到该包装');
        }
    });
}
</script>
