    </div>
</div>

        <div class="value" data-count="5">0</div>
    </div>
    <div class="kpi-card warning">
        <div class="label">待接收</div>
        <div class="value" data-count="1">0</div>

    <div class="kpi-card danger">
        <div class="label">超耗预警</div>
        <div class="value" data-count="1">0</div>
    </div>
    <div class="kpi-card danger">
        <div class="label">NCR 待处置</div>

    </div>
    <div class="kpi-card success">

        <div class="value" data-count="3">0</div>
    </div>

    </div>

<!-- 工序状态条 -->
<div class="card card-glow" style="margin-top:16px">

</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px">

        <div class="card-header">
            <h3>📈 5 天损耗趋势</h3>
        </div>
        <div class="card-body">
            <div id="bigscreen-loss-trend"></div>
        </div>
    </div>
    <div class="card card-glow">
        <div class="card-header">
            <h3>🐌 瓶颈工位 TOP 3</h3>
        </div>
        <div class="card-body">
            <div id="bigscreen-bottlenecks"></div>
        </div>
    </div>
</div>

<!-- 底部: 报警滚动条(后续接 SSE) -->
<div class="card" style="margin-top:16px;background:linear-gradient(90deg,var(--error-bg) 0%,transparent 100%)">
    <div class="card-body">
        <span class="text-danger text-bold">⚠ 实时报警:</span>
        <span class="text-secondary" style="margin-left:12px">

    </div>
</div>
