[options]
; 基础配置
admin_passwd = $odoo_admin_pwd
db_name = gold_mes
db_template = template1
dbfilter = ^gold_mes$
db_maxconn = 64
db_timezone = Asia/Shanghai
list_db = False

; 数据目录
data_dir = /mnt/odoo/filestore
session_dir = /mnt/odoo/sessions
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO

; 网络
http_port = 8069
http_interface = 0.0.0.0
xmlrpc_port = 8069
longpolling_port = 8072
proxy_mode = True

; 路径
addons_path = /mnt/odoo/addons,/usr/lib/python3/dist-packages/odoo/addons
; 包含 oca 扩展时补充
; addons_path = /mnt/odoo/addons,/mnt/odoo/oca-addons,/usr/lib/python3/dist-packages/odoo/addons

; 性能
workers = 4
max_cron_threads = 2
limit_memory_hard = 0
limit_memory_soft = 0
limit_time_real = 0
limit_time_cpu = 0
limit_request = 8192

; SMTP(可选)
; smtp_server = smtp.gmail.com
; smtp_port = 587
; smtp_user = user
; smtp_password = pwd
; smtp_ssl = True

; 模块自动安装
; init_modules = gold_mes

; 安全
super_admin_pwd = $odoo_admin_pwd
server_wide_modules = web,base_sparse_field

; 中文
limit_time_wait = 0
