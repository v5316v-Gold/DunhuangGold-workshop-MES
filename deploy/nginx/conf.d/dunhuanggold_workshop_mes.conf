server {
    listen 80;
    server_name _;

    # 反向代理 Odoo
    client_max_body_size 200M;

    # gzip
    gzip on;
    gzip_types text/css text/less text/plain text/xml application/json application/javascript application/xml application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1000;

    # 静态资源
    location ~* /web/static/ {
        proxy_pass http://odoo:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
    }

    # 长时间轮询
    location /websocket {
        proxy_pass http://odoo:8072;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # 主代理
    location / {
        proxy_pass http://odoo:8069;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # 健康检查
    location /health {
        access_log off;
        return 200 "OK\n";
    }

    # 看板静态文件(可选)
    location /dunhuanggold_workshop_mes/static/ {
        proxy_pass http://odoo:8069;
        proxy_set_header Host $host;
    }
}
